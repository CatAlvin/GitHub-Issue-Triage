{
  "openapi": "3.1.0",
  "info": {
    "title": "vscode Issue Triage MCP",
    "description": "Read-only MCP tools over public microsoft/vscode issues. MCP endpoint: /mcp (Streamable HTTP).",
    "version": "1.0.0"
  },
  "paths": {
    "/healthz": {
      "get": {
        "summary": "Healthz",
        "description": "Liveness only — no data load, no LLM call.",
        "operationId": "healthz_healthz_get",
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Health"
                }
              }
            }
          }
        }
      }
    },
    "/readyz": {
      "get": {
        "summary": "Readyz",
        "operationId": "readyz_readyz_get",
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Ready"
                }
              }
            }
          }
        }
      }
    },
    "/workspace/documents/{name}": {
      "get": {
        "tags": [
          "Workbench"
        ],
        "summary": "Document",
        "operationId": "document_workspace_documents__name__get",
        "parameters": [
          {
            "name": "name",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "title": "Name"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/workspace": {
      "get": {
        "tags": [
          "Workbench"
        ],
        "summary": "Workspace",
        "operationId": "workspace_workspace_get",
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          }
        }
      }
    },
    "/workspace/brief": {
      "post": {
        "tags": [
          "Workbench"
        ],
        "summary": "Brief",
        "operationId": "brief_workspace_brief_post",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Brief"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/workspace/ask": {
      "post": {
        "tags": [
          "Workbench"
        ],
        "summary": "Ask",
        "operationId": "ask_workspace_ask_post",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Ask"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "Ask": {
        "properties": {
          "question": {
            "type": "string",
            "maxLength": 2000,
            "minLength": 3,
            "title": "Question"
          }
        },
        "type": "object",
        "required": [
          "question"
        ],
        "title": "Ask"
      },
      "Brief": {
        "properties": {
          "days": {
            "type": "integer",
            "maximum": 90.0,
            "minimum": 1.0,
            "title": "Days",
            "default": 7
          }
        },
        "type": "object",
        "title": "Brief"
      },
      "HTTPValidationError": {
        "properties": {
          "detail": {
            "items": {
              "$ref": "#/components/schemas/ValidationError"
            },
            "type": "array",
            "title": "Detail"
          }
        },
        "type": "object",
        "title": "HTTPValidationError"
      },
      "Health": {
        "properties": {
          "status": {
            "type": "string",
            "title": "Status"
          },
          "version": {
            "type": "string",
            "title": "Version"
          }
        },
        "type": "object",
        "required": [
          "status",
          "version"
        ],
        "title": "Health"
      },
      "Ready": {
        "properties": {
          "status": {
            "type": "string",
            "title": "Status"
          },
          "repo": {
            "type": "string",
            "title": "Repo"
          },
          "source_file": {
            "type": "string",
            "title": "Source File"
          },
          "issues": {
            "type": "integer",
            "title": "Issues"
          },
          "oldest": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Oldest"
          },
          "newest": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Newest"
          },
          "by_state": {
            "additionalProperties": {
              "type": "integer"
            },
            "type": "object",
            "title": "By State"
          },
          "top_labels": {
            "additionalProperties": {
              "type": "integer"
            },
            "type": "object",
            "title": "Top Labels"
          },
          "kb_chunks": {
            "type": "integer",
            "title": "Kb Chunks"
          }
        },
        "type": "object",
        "required": [
          "status",
          "repo",
          "source_file",
          "issues",
          "oldest",
          "newest",
          "by_state",
          "top_labels",
          "kb_chunks"
        ],
        "title": "Ready"
      },
      "ValidationError": {
        "properties": {
          "loc": {
            "items": {
              "anyOf": [
                {
                  "type": "string"
                },
                {
                  "type": "integer"
                }
              ]
            },
            "type": "array",
            "title": "Location"
          },
          "msg": {
            "type": "string",
            "title": "Message"
          },
          "type": {
            "type": "string",
            "title": "Error Type"
          },
          "input": {
            "title": "Input"
          },
          "ctx": {
            "type": "object",
            "title": "Context"
          }
        },
        "type": "object",
        "required": [
          "loc",
          "msg",
          "type"
        ],
        "title": "ValidationError"
      }
    }
  },
  "x-mcp": {
    "transports": [
      "stdio",
      "streamable-http"
    ],
    "tools": [
      {
        "name": "dataset_info",
        "description": "Size, date range, state split and top labels of the loaded issue snapshot.",
        "inputSchema": {
          "properties": {},
          "title": "_dataset_infoArguments",
          "type": "object"
        },
        "annotations": {
          "readOnlyHint": true,
          "openWorldHint": false
        }
      },
      {
        "name": "search_issues",
        "description": "Find issues by substring in title/body, exact label (e.g. 'bug',\n        'freeze-slow-crash-leak') and/or state ('open'|'closed'). Newest first.",
        "inputSchema": {
          "properties": {
            "query": {
              "default": "",
              "title": "Query",
              "type": "string"
            },
            "label": {
              "default": "",
              "title": "Label",
              "type": "string"
            },
            "state": {
              "default": "",
              "title": "State",
              "type": "string"
            },
            "limit": {
              "default": 10,
              "title": "Limit",
              "type": "integer"
            }
          },
          "title": "_search_issuesArguments",
          "type": "object"
        },
        "outputSchema": {
          "properties": {
            "result": {
              "items": {
                "additionalProperties": true,
                "type": "object"
              },
              "title": "Result",
              "type": "array"
            }
          },
          "required": [
            "result"
          ],
          "title": "_search_issuesOutput",
          "type": "object"
        },
        "annotations": {
          "readOnlyHint": true,
          "openWorldHint": false
        }
      },
      {
        "name": "scan_risks",
        "description": "Run the three independent risk rules (unaddressed_security,\n        severity_keyword_match, fast_escalating_regression); each hit has evidence.",
        "inputSchema": {
          "properties": {},
          "title": "_scan_risksArguments",
          "type": "object"
        },
        "annotations": {
          "readOnlyHint": true,
          "openWorldHint": false
        }
      },
      {
        "name": "summarize_issues",
        "description": "Label breakdown + engineer-facing summary of issues opened in the last N days.",
        "inputSchema": {
          "properties": {
            "days": {
              "default": 7,
              "title": "Days",
              "type": "integer"
            }
          },
          "title": "_summarize_issuesArguments",
          "type": "object"
        },
        "outputSchema": {
          "properties": {
            "result": {
              "title": "Result",
              "type": "string"
            }
          },
          "required": [
            "result"
          ],
          "title": "_summarize_issuesOutput",
          "type": "object"
        },
        "annotations": {
          "readOnlyHint": true,
          "openWorldHint": false
        }
      },
      {
        "name": "ask_contributing",
        "description": "Answer from vscode's CONTRIBUTING.md with a [source] citation, or refuse.",
        "inputSchema": {
          "properties": {
            "question": {
              "title": "Question",
              "type": "string"
            }
          },
          "required": [
            "question"
          ],
          "title": "_ask_contributingArguments",
          "type": "object"
        },
        "outputSchema": {
          "properties": {
            "result": {
              "title": "Result",
              "type": "string"
            }
          },
          "required": [
            "result"
          ],
          "title": "_ask_contributingOutput",
          "type": "object"
        },
        "annotations": {
          "readOnlyHint": true,
          "openWorldHint": false
        }
      }
    ]
  },
  "x-authentication": {
    "environment": "SERVICE_API_KEY",
    "header": "Authorization: Bearer <token>",
    "public_paths": [
      "/healthz",
      "/",
      "/assets/*"
    ],
    "when_unset": "local access without authentication"
  }
}
