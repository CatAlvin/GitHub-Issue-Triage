name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      APP_MODE: offline
      PYTHONUTF8: "1"
      SERVICE_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Tests and protocol contracts
        run: python scripts/verify.py
      - name: Real HTTP checks
        run: python scripts/smoke_http.py
      - name: Frontend syntax and document rendering
        run: |
          node --check web/app.js
          node --test tests/markdown.test.cjs
      - name: README figures and links
        run: |
          python scripts/readme_assets.py --check
          python scripts/check_docs.py
